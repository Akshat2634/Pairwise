name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  transport:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false
      - run: python windows/tests/transport-probe.py
