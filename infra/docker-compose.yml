services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run ./setup.sh first}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run ./setup.sh first}
    ports:
      - "127.0.0.1:17880:7880/tcp"
      - "127.0.0.1:17881:17881/tcp"
      - "127.0.0.1:17882-17981:17882-17981/udp"
    restart: unless-stopped
  api:
    build:
      context: ../server
    environment:
      PAIRDESK_ADDR: 0.0.0.0:8080
      PAIRDESK_DATA: /data/pairdesk.json
      LIVEKIT_URL: ws://127.0.0.1:17880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run ./setup.sh first}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run ./setup.sh first}
    volumes:
      - pairdesk-data:/data
    ports:
      - "127.0.0.1:18080:8080/tcp"
    depends_on:
      - livekit
    restart: unless-stopped
volumes:
  pairdesk-data:
