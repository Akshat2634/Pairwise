services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.2
    command:
      - --address=0.0.0.0
      - --port=5432
      - --structured-logs
      - ${PAIRDESK_CLOUD_SQL_CONNECTION_NAME:?run configure-cloudsql.py}
    expose:
      - '5432'
    restart: unless-stopped
  api:
    depends_on:
      livekit:
        condition: service_started
      cloud-sql-proxy:
        condition: service_started
